<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d2b45">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d2b45'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='%235fe0cd' font-family='Georgia'>P</text></svg>">
  <title>概率论与数理统计 · 系统学习平台</title>
  <link rel="stylesheet" href="css/katex.min.css">
  <link rel="stylesheet" href="css/highlight-github.css">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- 顶部栏 -->
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="打开目录">
      <span></span><span></span><span></span>
    </button>
    <div class="brand" id="brandHome">
      <span class="brand-mark">P<span>·</span>S</span>
      <span class="brand-text">概率统计实验室</span>
    </div>
    <button class="search-btn" id="searchBtn" aria-label="搜索">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
    </button>
  </header>

  <!-- 抽屉遮罩 -->
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- 侧边抽屉 / 目录 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-title">课程目录</div>
      <div class="sidebar-sub" id="sidebarProgress">共 14 部分 · 119 章</div>
    </div>
    <div class="sidebar-search">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
      <input type="text" id="navFilter" placeholder="筛选章节…" autocomplete="off">
    </div>
    <nav class="nav-list" id="navList"></nav>
    <div class="sidebar-foot">
      <div class="source-note">三本经典教材融合编排</div>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main" id="main">
    <div class="content-wrap" id="contentWrap">
      <!-- 由 JS 渲染 -->
    </div>
    <footer class="footer" id="footer">
      <span>概率论与数理统计系统学习平台</span>
      <span class="footer-dot">·</span>
      <span>基于 Wheelan / OpenIntro / Blitzstein &amp; Hwang 三本教材融合</span>
    </footer>
  </main>

  <!-- 搜索面板 -->
  <div class="search-panel" id="searchPanel" hidden>
    <div class="search-panel-inner">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
        <input type="text" id="searchInput" placeholder="搜索知识点，如：贝叶斯、标准差、中心极限定理…" autocomplete="off">
        <button id="searchClose" aria-label="关闭">✕</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <!-- 脚本（本地依赖，离线可用） -->
  <script src="js/vendor/katex.min.js"></script>
  <script src="js/vendor/auto-render.min.js"></script>
  <script src="js/vendor/marked.min.js"></script>
  <script src="js/vendor/highlight.min.js"></script>
  <script src="js/vendor/chart.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/widgets.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
